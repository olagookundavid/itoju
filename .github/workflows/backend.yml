name: Backend

on:
  push:
    branches: [main]
    paths:
      - "Itoju_backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "Itoju_backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: Itoju_backend

jobs:
  test:
    runs-on: ubuntu-latest
    # Real Postgres so the DB-backed tests (password-reset brute-force cap,
    # session revocation, sync quarantine, analytics equivalence, …) actually
    # run in CI instead of being skipped.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itoju
          POSTGRES_PASSWORD: itoju
          POSTGRES_DB: itoju
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itoju"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ITOJU_TEST_DB: postgres://itoju:itoju@localhost:5432/itoju?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: Itoju_backend/go.mod
          cache-dependency-path: Itoju_backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
